<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bhava Food Ordering</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f8f8f8;
    }

    header {
      background: #ff4d4d;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 24px;
    }

    nav {
      display: flex;
      justify-content: center;
      background: #333;
    }

    nav a {
      color: white;
      padding: 14px 20px;
      text-decoration: none;
    }

    nav a:hover {
      background: #ff4d4d;
    }

    .container {
      padding: 20px;
      text-align: center;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .card button {
      background: #ff4d4d;
      color: white;
      border: none;
      padding: 10px;
      margin-top: 10px;
      cursor: pointer;
      border-radius: 5px;
    }

    footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 10px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <header>
    🍔 Bhava Food Ordering System
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">Menu</a>
    <a href="#">Order</a>
    <a href="#">Contact</a>
  </nav>

  <div class="container">
    <h2>Our Menu 😋</h2>

    <div class="menu">

      <div class="card">
        <h3>Burger</h3>
        <p>₹120</p>
        <button onclick="order('Burger')">Order Now</button>
      </div>

      <div class="card">
        <h3>Pizza</h3>
        <p>₹250</p>
        <button onclick="order('Pizza')">Order Now</button>
      </div>

      <div class="card">
        <h3>Fried Rice</h3>
        <p>₹150</p>
        <button onclick="order('Fried Rice')">Order Now</button>
      </div>

      <div class="card">
        <h3>Juice</h3>
        <p>₹80</p>
        <button onclick="order('Juice')">Order Now</button>
      </div>

    </div>
  </div>

  <footer>
    © 2026 Bhava Food Ordering System
  </footer>

  <script>
    function order(item) {
      alert("You ordered " + item + " 🍽️");
    }
  </script>

</body>
  </html>
